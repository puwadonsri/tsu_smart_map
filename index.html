<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TSU Smart Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --navy:#0D47A1;      /* ธีมสีหลักตาม requirement */
  --blue:#1976D2;
  --red:#E53935;
  --red-dark:#C62828;
  --ink:#1a1a1a;
  --muted:#8a8f98;
  --line:#eceff1;
  --bar-h:104px;       /* ความสูงจริงของ bottom bar ใช้กันไม่ให้ FAB ทับ */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Roboto,Tahoma,sans-serif;overflow:hidden;height:100vh;width:100vw;background:var(--navy);color:var(--ink)}
button{font-family:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;user-select:none}

/* ---------- 1. Splash ---------- */
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(170deg,#5D9CEC 0%,#1976D2 55%,#0D47A1 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .pin{width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;animation:bounce 1.6s ease-in-out infinite}
#splash .pin .ms{font-size:60px;color:#fff}
#splash h1{color:#fff;font-size:40px;font-weight:800;letter-spacing:1px;margin-top:20px;line-height:1.15}
#splash h1 small{display:block;font-size:24px;font-weight:600;letter-spacing:0}
#splash .campus{color:rgba(255,255,255,.95);font-size:16px;margin-top:10px}
#splash .tagline{color:rgba(255,255,255,.8);font-size:14px;margin-top:6px;font-style:italic}
#splash .brand{position:absolute;bottom:44px;color:rgba(255,255,255,.85);font-size:12px;letter-spacing:3px;font-weight:600}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- 2. Map + top bar ---------- */
#map{position:fixed;inset:0;z-index:1;background:#e8eaed}
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent)}
.btn-round{width:44px;height:44px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-round .ms{font-size:24px;color:var(--navy)}
.search-wrap{flex:1;position:relative}
.search-wrap>.ms{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;color:#9aa0a6;pointer-events:none}
.search-wrap input{width:100%;height:44px;border:none;border-radius:22px;padding:0 16px 0 44px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.22);outline:none;font-family:inherit}

#sresults{position:fixed;top:66px;left:14px;right:14px;z-index:99;background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:320px;overflow-y:auto;display:none}
#sresults.on{display:block}
.sri{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sri:last-child{border-bottom:none}
.sri:active{background:#e3f2fd}
.si{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:32px;height:32px;border-radius:50%}
.si .ms{font-size:18px;color:#fff}
.sri .nm{font-size:14px;font-weight:600}
.sri .ct{font-size:11px;color:var(--muted)}
.sempty{padding:16px;text-align:center;color:var(--muted);font-size:13px}

/* ปุ่มควบคุมแผนที่ด้านขวา (ตำแหน่งฉัน / กลับจุดกึ่งกลาง) */
#mapctl{position:fixed;right:14px;z-index:100;display:flex;flex-direction:column;gap:10px;bottom:calc(var(--bar-h) + 74px)}
#mapctl .btn-round{width:46px;height:46px}

/* ปุ่มฉุกเฉินลอย — วางเหนือ bottom bar ไม่ให้ทับกัน */
#fab{position:fixed;right:14px;bottom:calc(var(--bar-h) + 12px);z-index:100;background:var(--red);color:#fff;border:none;border-radius:16px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(229,57,53,.5);display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;text-align:left;line-height:1.35;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 14px rgba(229,57,53,.5)}50%{box-shadow:0 4px 24px rgba(229,57,53,.85)}}
#fab .ms{font-size:24px}

/* แถบทางลัดด้านล่าง */
#bbar{position:fixed;bottom:12px;left:14px;right:14px;z-index:100;background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;padding:12px 8px;justify-content:space-around}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 8px;border:none;background:transparent;border-radius:12px;cursor:pointer;flex:1}
.sc{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.sc .ms{font-size:26px}
.slb{font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink)}

/* ---------- 3. Drawer ---------- */
#dov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#dov.on{opacity:1;pointer-events:all}
#drawer{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:320px;z-index:201;background:#fff;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#drawer.on{transform:translateX(0)}
#dhead{background:var(--navy);color:#fff;padding:22px 16px 16px}
#dhead h2{font-size:18px}
#dhead p{font-size:11px;opacity:.85;margin-top:3px}
.dtitle{padding:16px 16px 4px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.dtitle .x{background:none;border:none;cursor:pointer;color:#555;display:flex;padding:4px}
#dfilters{padding:0 10px 20px;overflow-y:auto;flex:1}
.dgroup{font-size:12px;font-weight:700;color:var(--muted);padding:14px 8px 6px}
.li{display:flex;align-items:center;gap:12px;padding:8px}
.li .lbtn{display:flex;align-items:center;gap:12px;flex:1;background:none;border:none;padding:4px 0;cursor:pointer;text-align:left;min-width:0}
.lc{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lc .ms{font-size:22px;color:#fff}
.lf{flex:1;min-width:0}
.ln{display:block;font-weight:700;font-size:14px}
.ld{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.tg{position:relative;width:46px;height:26px;flex-shrink:0}
.tg input{opacity:0;width:0;height:0}
.tg .sl{position:absolute;inset:0;background:#ccc;border-radius:26px;cursor:pointer;transition:.3s}
.tg .sl:before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.3s}
.tg input:checked+.sl{background:var(--blue)}
.tg input:checked+.sl:before{transform:translateX(20px)}

/* ---------- Bottom sheets ---------- */
.bov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.bov.on{opacity:1;pointer-events:all}
.bsh{position:fixed;bottom:0;left:0;right:0;z-index:301;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:86vh;display:flex;flex-direction:column}
.bsh.on{transform:translateY(0)}
.shead{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--navy);color:#fff;border-radius:20px 20px 0 0;flex-shrink:0}
.shead .back{background:none;border:none;color:#fff;display:flex;cursor:pointer;padding:2px}
.shead h3{font-size:17px;font-weight:700;flex:1}
.sbody{padding:16px 18px 24px;overflow-y:auto}

/* ---------- 6. Emergency (เต็มหน้าจอสีแดง) ---------- */
#esh{background:linear-gradient(180deg,var(--red) 0%,var(--red-dark) 100%);color:#fff;top:0;border-radius:0;max-height:none}
#esh .shead{background:transparent;border-radius:0}
#esh .sbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px 40px}
.ering{width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;animation:ring 1.8s ease-in-out infinite}
.ering .inner{width:126px;height:126px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.ering .ms{font-size:64px;color:#fff}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ec-lb{font-size:22px;font-weight:600;margin-top:28px}
.ec-ph{font-size:40px;font-weight:800;letter-spacing:2px;margin-top:6px}
.ec-ds{font-size:15px;opacity:.9;margin-top:10px;line-height:1.5}
.ec-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;background:#fff;color:var(--red);padding:17px 0;border-radius:32px;font-size:18px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25);margin-top:44px}

/* ---------- 4. รายการตลาด ---------- */
.mc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.mc:active{background:#f5f8ff}
.mi{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi .ms{font-size:28px}
.mtext{flex:1;min-width:0}
.mn{display:block;font-weight:700;font-size:15px}
.meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:3px}
.meta .ms{font-size:14px}
.mt{display:block;font-size:12px;color:#5f6368;margin-top:4px;line-height:1.4}
.allbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;background:#E8F0FE;color:var(--navy);border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}

/* ---------- 5. รายละเอียดตลาด / จุดบนแผนที่ ---------- */
.dhero{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.dname{display:block;font-size:20px;font-weight:800}
.ddetail{font-size:14px;color:#5f6368;line-height:1.55;margin:12px 0 18px}
.drow{display:flex;gap:10px;margin-bottom:20px}
.dbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;border:none}
.dbtn.primary{background:var(--navy);color:#fff}
.dbtn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.dsub{font-size:14px;font-weight:700;margin-bottom:10px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:#f1f3f4;border-radius:10px;padding:10px 14px;font-size:12px;color:#3c4043}
.chip .ms{font-size:18px;color:var(--navy)}
.chip b{font-weight:700}

/* ---------- 7/8. รายการจุดในชั้นข้อมูล ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border:none;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.lrow:last-child{border-bottom:none}
.lrow:active{background:#f5f8ff}
.lnum{width:24px;font-size:14px;font-weight:700;color:var(--muted);flex-shrink:0}
.lname{flex:1;min-width:0;font-size:14px;font-weight:600}
.lname small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.lrow>.ms{color:#c0c4c9}
</style>
</head>
<body>

<!-- 1. หน้าเปิดแอป -->
<div id="splash">
  <div class="pin"><span class="ms">location_on</span></div>
  <h1>TSU<br><small>Smart Map</small></h1>
  <p class="campus" id="spCampus"></p>
  <p class="tagline" id="spTag"></p>
  <div class="brand">THAKSIN UNIVERSITY</div>
</div>

<!-- 2. หน้าแรก: แผนที่เต็มหน้าจอ -->
<div id="map"></div>

<div id="topbar">
  <button class="btn-round" id="menuBtn" aria-label="เมนู"><span class="ms">menu</span></button>
  <div class="search-wrap">
    <span class="ms">search</span>
    <input id="sbox" type="text" placeholder="ค้นหาสถานที่ ภายใน ม.ทักษิณ พัทลุง">
  </div>
</div>
<div id="sresults"></div>

<div id="mapctl">
  <button class="btn-round" id="locBtn" aria-label="ตำแหน่งของฉัน"><span class="ms">my_location</span></button>
  <button class="btn-round" id="homeBtn" aria-label="กลับไปกลางมหาวิทยาลัย"><span class="ms">near_me</span></button>
</div>

<button id="fab">
  <span class="ms">phone_in_talk</span>
  <span id="fabLabel"></span>
</button>

<div id="bbar"></div>

<!-- 3. แถบด้านข้าง: ตัวกรองชั้นข้อมูล -->
<div id="dov"></div>
<div id="drawer">
  <div id="dhead"><h2 id="dname"></h2><p id="dcampus"></p></div>
  <div class="dtitle"><span>ตัวกรองชั้นข้อมูล</span><button class="x" id="dclose" aria-label="ปิด"><span class="ms">close</span></button></div>
  <div id="dfilters"></div>
</div>

<!-- 6. หน้าโทรฉุกเฉิน -->
<div class="bov" id="eov"></div>
<div class="bsh" id="esh">
  <div class="shead"><button class="back" data-close="e" aria-label="ย้อนกลับ"><span class="ms">arrow_back</span></button><h3 id="etitle"></h3></div>
  <div class="sbody">
    <div class="ering"><div class="inner"><span class="ms">call</span></div></div>
    <div class="ec-lb">โทรออกทันที</div>
    <div class="ec-ph" id="eph"></div>
    <div class="ec-ds" id="eds"></div>
    <a class="ec-btn" id="ecall" href="#"><span class="ms">call</span> กดโทรออก</a>
  </div>
</div>

<!-- 4. รายชื่อตลาดใกล้มหาวิทยาลัย -->
<div class="bov" id="mov"></div>
<div class="bsh" id="msh">
  <div class="shead"><button class="back" data-close="m" aria-label="ย้อนกลับ"><span class="ms">arrow_back</span></button><h3>ตลาดใกล้มหาวิทยาลัย</h3></div>
  <div class="sbody" id="mbody"></div>
</div>

<!-- 5. รายละเอียด (ตลาด / จุดบนแผนที่) -->
<div class="bov" id="pov"></div>
<div class="bsh" id="psh">
  <div class="shead"><button class="back" data-close="p" aria-label="ย้อนกลับ"><span class="ms">arrow_back</span></button><h3 id="ptitle"></h3></div>
  <div class="sbody" id="pbody"></div>
</div>

<!-- 7/8. รายการจุดทั้งหมดของชั้นข้อมูล -->
<div class="bov" id="lov"></div>
<div class="bsh" id="lsh">
  <div class="shead"><button class="back" data-close="l" aria-label="ย้อนกลับ"><span class="ms">arrow_back</span></button><h3 id="ltitle"></h3></div>
  <div class="sbody" id="lbody"></div>
</div>

<script>
'use strict';

/* ชื่อไอคอนแบบสั้นใน config -> ชื่อจริงของ Material Symbols */
const ICON_ALIAS = {warning:'warning_amber', bus:'directions_bus', market:'storefront', phone:'phone_in_talk'};
const icon = n => ICON_ALIAS[n] || n || 'place';

let C = null, map = null, layerGroups = {}, marketGroup = null, meMarker = null, searchHits = [];

/* ===== utils ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPhone = n => (n && n.length === 10 && n[0] === '0') ? `${n.slice(0,3)}-${n.slice(3,6)}-${n.slice(6)}` : (n || '');
const dirUrl = (lat, lng, mode = 'driving') =>
  `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=${mode}`;
const minutes = (km, kmh) => Math.max(1, Math.round((km / kmh) * 60));
const walkMin = km => minutes(km, C.map.travel?.walkKmh ?? 4.5);
const driveMin = km => minutes(km, C.map.travel?.driveKmh ?? 30);
const layerById = id => C.layers.find(l => l.id === id);

/* ===== โหลด config: ไฟล์ภายนอกก่อน แล้วค่อย fallback มาที่ config ฝังในตัวแอป ===== */
async function loadConfig() {
  for (const url of ['config/app_config.json', 'tsu_smart_map/assets/config/app_config.json']) {
    try {
      const res = await fetch(url, {cache: 'no-store'});
      if (res.ok) { C = await res.json(); return url; }
    } catch { /* ลอง path ถัดไป */ }
  }
  C = DEFAULT_CONFIG;
  return 'embedded';
}

/* ===== 1. แผนที่ + หมุด ===== */
function initMap() {
  map = L.map('map', {
    center: [C.map.center.lat, C.map.center.lng],
    zoom: C.map.zoom, minZoom: C.map.minZoom, maxZoom: C.map.maxZoom,
    zoomControl: false
  });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);
  refreshMarkers();
}

function pinIcon(color, iconName, label) {
  return L.divIcon({
    className: '',
    html: `<div style="text-align:center;transform:translate(-50%,-100%)">
      <div style="background:${esc(color)};border:3px solid #fff;border-radius:50%;width:38px;height:38px;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35)">
        <span class="ms" style="font-size:20px;color:#fff">${esc(icon(iconName))}</span></div>
      <div style="background:#fff;color:#1a1a1a;padding:2px 7px;border-radius:7px;font-size:10px;font-weight:700;white-space:nowrap;margin-top:3px;display:inline-block;box-shadow:0 1px 4px rgba(0,0,0,.25)">${esc(label)}</div>
    </div>`,
    iconSize: [0, 0], iconAnchor: [0, 0]
  });
}

function refreshMarkers() {
  Object.values(layerGroups).forEach(g => map.removeLayer(g));
  layerGroups = {};
  C.layers.forEach(layer => {
    if (!layer.enabled) return;
    const group = L.featureGroup();
    layer.locations.forEach(loc => {
      L.marker([loc.lat, loc.lng], {icon: pinIcon(layer.color, layer.icon, loc.name)})
        .addTo(group)
        .on('click', () => showPlace(layer, loc));
    });
    group.addTo(map);
    layerGroups[layer.id] = group;
  });
}

/* ปุ่ม "ดูเส้นทางทั้งหมดบนแผนที่" — วางหมุดตลาดทุกจุดแล้วซูมให้เห็นครบ */
function showAllMarketsOnMap() {
  if (marketGroup) map.removeLayer(marketGroup);
  marketGroup = L.featureGroup();
  C.markets.forEach(mk => {
    L.marker([mk.lat, mk.lng], {icon: pinIcon('#E91E63', mk.icon || 'storefront', mk.name)})
      .addTo(marketGroup)
      .on('click', () => showMarket(mk));
  });
  marketGroup.addTo(map);
  const bounds = marketGroup.getBounds().extend([C.map.center.lat, C.map.center.lng]);
  closeAllSheets();
  map.fitBounds(bounds, {padding: [60, 60], maxZoom: 16});
}

/* ===== 3. แถบด้านข้าง (ตัวกรองชั้นข้อมูล) ===== */
function buildDrawer() {
  $('dname').textContent = C.app.name;
  $('dcampus').textContent = C.app.campusName;

  // จัดกลุ่มตามฟิลด์ group ใน config (ถ้าไม่ระบุ ใช้ "ประเภทสถานที่")
  const groups = new Map();
  C.layers.forEach(l => {
    const g = l.group || 'ประเภทสถานที่';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(l);
  });

  $('dfilters').innerHTML = [...groups].map(([title, layers]) => `
    <div class="dgroup">${esc(title)}</div>
    ${layers.map(l => `
      <div class="li">
        <button class="lbtn" data-layer-list="${esc(l.id)}">
          <span class="lc" style="background:${esc(l.color)}"><span class="ms">${esc(icon(l.icon))}</span></span>
          <span class="lf"><span class="ln">${esc(l.name)}</span><span class="ld">${esc(l.description || '')}</span></span>
        </button>
        <label class="tg"><input type="checkbox" data-layer-toggle="${esc(l.id)}" ${l.enabled ? 'checked' : ''}><span class="sl"></span></label>
      </div>`).join('')}
  `).join('');
}

function toggleLayer(id) {
  const layer = layerById(id);
  if (!layer) return;
  layer.enabled = !layer.enabled;
  refreshMarkers();
  buildShortcutBar();
  // อัปเดตเฉพาะสวิตช์ที่เกี่ยวข้อง ไม่ rebuild drawer ทั้งก้อน
  const box = $('dfilters').querySelector(`input[data-layer-toggle="${CSS.escape(id)}"]`);
  if (box) box.checked = layer.enabled;
}

/* ===== 2. แถบทางลัดด้านล่าง ===== */
function buildShortcutBar() {
  $('bbar').innerHTML = C.shortcuts.map(sc => {
    const active = sc.action === 'toggleLayer' && sc.layerId && layerById(sc.layerId)?.enabled;
    return `<button class="sbtn" data-shortcut="${esc(sc.id)}">
      <span class="sc" style="background:${active ? esc(sc.color) : esc(sc.color) + '1F'};color:${active ? '#fff' : esc(sc.color)}"><span class="ms">${esc(icon(sc.icon))}</span></span>
      <span class="slb">${esc(sc.label)}</span></button>`;
  }).join('');
}

function runShortcut(id) {
  const sc = C.shortcuts.find(s => s.id === id);
  if (!sc) return;
  if (sc.action === 'markets') showMarkets();
  else if (sc.action === 'emergency') showEmergency();
  else if (sc.action === 'toggleLayer' && sc.layerId) toggleLayer(sc.layerId);
  else if (sc.action === 'layerList' && sc.layerId) showLayerList(sc.layerId);
}

/* ===== ค้นหา ===== */
function searchIndex() {
  const out = [];
  C.layers.forEach(l => l.locations.forEach(loc =>
    out.push({name: loc.name, category: l.name, color: l.color, icon: l.icon, lat: loc.lat, lng: loc.lng, layer: l, loc})));
  C.markets.forEach(mk =>
    out.push({name: mk.name, category: 'ตลาดใกล้มหาวิทยาลัย', color: '#E91E63', icon: mk.icon || 'storefront', lat: mk.lat, lng: mk.lng, market: mk}));
  return out;
}

function onSearch(query) {
  const box = $('sresults'), q = query.trim().toLowerCase();
  if (!q) { box.classList.remove('on'); box.innerHTML = ''; searchHits = []; return; }
  searchHits = searchIndex().filter(r => r.name.toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = searchHits.length
    ? searchHits.map((r, i) => `<div class="sri" data-hit="${i}">
        <span class="si" style="background:${esc(r.color)}"><span class="ms">${esc(icon(r.icon))}</span></span>
        <span><span class="nm">${esc(r.name)}</span><br><span class="ct">${esc(r.category)}</span></span></div>`).join('')
    : `<div class="sempty">ไม่พบสถานที่ที่ตรงกับ "${esc(query.trim())}"</div>`;
  box.classList.add('on');
}

function pickSearchHit(hit) {
  if (!hit) return;
  $('sbox').value = '';
  $('sresults').classList.remove('on');
  searchHits = [];
  map.setView([hit.lat, hit.lng], 18);
  if (hit.market) showMarket(hit.market);
  else showPlace(hit.layer, hit.loc);
}

/* ===== bottom sheets ===== */
function openSheet(key) { closeAllSheets(); $(key + 'ov').classList.add('on'); $(key + 'sh').classList.add('on'); }
function closeSheet(key) { $(key + 'ov').classList.remove('on'); $(key + 'sh').classList.remove('on'); }
function closeAllSheets() { ['e', 'm', 'p', 'l'].forEach(closeSheet); }

/* 6. โทรฉุกเฉิน */
function showEmergency() {
  const num = C.app.emergencyNumber;
  $('etitle').textContent = C.app.emergencyTitle || 'เบอร์ฉุกเฉิน';
  $('eph').textContent = fmtPhone(num);
  $('eds').textContent = C.app.emergencyLabel || '';
  $('ecall').href = 'tel:' + num;
  openSheet('e');
}

/* 4. รายชื่อตลาด */
function showMarkets() {
  $('mbody').innerHTML = C.markets.map((mk, i) => `
    <div class="mc" data-market="${i}">
      <span class="mi" style="background:#E91E6318"><span class="ms" style="color:#E91E63">${esc(icon(mk.icon || 'storefront'))}</span></span>
      <span class="mtext">
        <span class="mn">${esc(mk.name)}</span>
        <span class="meta"><span><span class="ms">location_on</span>${esc(mk.distanceKm)} กม.</span><span><span class="ms">directions_walk</span>ประมาณ ${walkMin(mk.distanceKm)} นาที</span></span>
        <span class="mt">${esc(mk.detail)}</span>
      </span>
      <span class="ms">chevron_right</span>
    </div>`).join('')
    + `<button class="allbtn" id="allMarkets"><span class="ms">map</span> ดูเส้นทางทั้งหมดบนแผนที่</button>`;
  openSheet('m');
}

      <span><span class="dname">${esc(mk.name)}</span>
      <span class="meta"><span><span class="ms">location_on</span>${esc(mk.distanceKm)} กม.</span></span></span>

    <div class="drow">
      <a class="dbtn primary" href="${dirUrl(mk.lat, mk.lng)}" target="_blank" rel="noopener noreferrer"><span class="ms">navigation</span> นำทาง</a>
      <button class="dbtn ghost" data-share="${esc(mk.name)}|${mk.lat}|${mk.lng}"><span class="ms">share</span> แชร์</button>

/* 2. รายละเอียดจุดบนแผนที่ */
function showPlace(layer, loc) {
  $('ptitle').textContent = layer.name;
  $('pbody').innerHTML = `
    <div class="dhero">
      <span class="si" style="background:${esc(layer.color)};width:44px;height:44px"><span class="ms" style="font-size:24px">${esc(icon(layer.icon))}</span></span>
      <span><span class="dname">${esc(loc.name)}</span>
      <span class="meta"><span>${esc(layer.name)}</span></span></span>
    </div>
    <div class="ddetail">${esc(loc.detail)}</div>
    <div class="drow">
      <a class="dbtn primary" href="${dirUrl(loc.lat, loc.lng)}" target="_blank" rel="noopener noreferrer"><span class="ms">navigation</span> นำทางไป Google Maps</a>
      <button class="dbtn ghost" data-share="${esc(loc.name)}|${loc.lat}|${loc.lng}"><span class="ms">share</span> แชร์</button>
    </div>`;
  openSheet('p');
}

/* 7/8. รายการจุดทั้งหมดของชั้นข้อมูลหนึ่ง ๆ */
function showLayerList(layerId) {
  const layer = layerById(layerId);
  if (!layer) return;
  $('ltitle').textContent = layer.listTitle || layer.name;
  $('lbody').innerHTML = layer.locations.map((loc, i) => `
    <button class="lrow" data-point="${esc(layerId)}|${i}">
      <span class="lnum">${i + 1}.</span>
      <span class="lname">${esc(loc.name)}<small>${esc(loc.detail)}</small></span>
      <span class="ms">chevron_right</span>
    </button>`).join('');
  openSheet('l');
}

function focusPoint(layerId, index) {
  const layer = layerById(layerId);
  const loc = layer?.locations[index];
  if (!loc) return;
  if (!layer.enabled) toggleLayer(layerId);   // เปิดชั้นข้อมูลให้อัตโนมัติเมื่อเลือกจุดในนั้น
  map.setView([loc.lat, loc.lng], 18);
  showPlace(layer, loc);
}

/* ===== ตำแหน่งผู้ใช้ ===== */
function locateMe() {
  if (!navigator.geolocation) {
    alert('เบราว์เซอร์นี้ไม่รองรับการอ่านตำแหน่ง');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const p = [pos.coords.latitude, pos.coords.longitude];
      if (meMarker) map.removeLayer(meMarker);
      meMarker = L.circleMarker(p, {radius: 9, color: '#fff', weight: 3, fillColor: '#1976D2', fillOpacity: 1}).addTo(map);
      map.setView(p, 17);
    },
    () => alert('ไม่สามารถอ่านตำแหน่งของคุณได้ กรุณาอนุญาตการเข้าถึงตำแหน่งในเบราว์เซอร์'),
    {enableHighAccuracy: true, timeout: 8000}
  );
}

/* ===== การผูก event (ใช้ delegation แทน inline onclick) ===== */
function wireEvents() {
  const openDrawer = () => { $('dov').classList.add('on'); $('drawer').classList.add('on'); };
  const closeDrawer = () => { $('dov').classList.remove('on'); $('drawer').classList.remove('on'); };

  $('menuBtn').onclick = openDrawer;
  $('dclose').onclick = closeDrawer;
  $('dov').onclick = closeDrawer;
  $('fab').onclick = showEmergency;
  $('locBtn').onclick = locateMe;
  $('homeBtn').onclick = () => map.setView([C.map.center.lat, C.map.center.lng], C.map.zoom);
  $('sbox').addEventListener('input', e => onSearch(e.target.value));

  ['e', 'm', 'p', 'l'].forEach(k => { $(k + 'ov').onclick = () => closeSheet(k); });

  document.addEventListener('click', e => {
    const el = sel => e.target.closest(sel);

    const back = el('[data-close]');
    if (back) return closeSheet(back.dataset.close);

    const sc = el('[data-shortcut]');
    if (sc) return runShortcut(sc.dataset.shortcut);

    const tog = el('input[data-layer-toggle]');
    if (tog) return toggleLayer(tog.dataset.layerToggle);

    const list = el('[data-layer-list]');
    if (list) { closeDrawer(); return showLayerList(list.dataset.layerList); }

    const pt = el('[data-point]');
    if (pt) { const [id, i] = pt.dataset.point.split('|'); return focusPoint(id, Number(i)); }

    const mk = el('[data-market]');
    if (mk) return showMarket(C.markets[Number(mk.dataset.market)]);

    if (el('#allMarkets')) return showAllMarketsOnMap();

    const sh = el('[data-share]');
    if (sh) {
      const [name, lat, lng] = sh.dataset.share.split('|');
      const url = dirUrl(lat, lng);
      if (navigator.share) navigator.share({title: name, text: `${name} — TSU Smart Map`, url}).catch(() => {});
      else navigator.clipboard?.writeText(`${name}\n${url}`).then(() => alert('คัดลอกลิงก์แล้ว'), () => {});
      return;
    }

    const hit = el('[data-hit]');
    if (hit) return pickSearchHit(searchHits[Number(hit.dataset.hit)]);

    if (!el('.search-wrap') && !el('#sresults')) $('sresults').classList.remove('on');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawer(); closeAllSheets(); $('sresults').classList.remove('on'); }
  });
}

/* ===== เริ่มทำงาน ===== */
(async () => {
  await loadConfig();
  $('spCampus').textContent = C.app.campusName;
  $('spTag').textContent = C.app.tagline ? `"${C.app.tagline}"` : '';
  $('fabLabel').innerHTML = `เบอร์ฉุกเฉิน<br>${esc(fmtPhone(C.app.emergencyNumber))}`;
  buildDrawer();
  buildShortcutBar();
  wireEvents();
  await new Promise(r => setTimeout(r, 1800));
  $('splash').classList.add('hide');
  initMap();
  setTimeout(() => map.invalidateSize(), 550);
})();
</script>
